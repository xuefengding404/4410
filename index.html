<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B1022" />
    <meta name="description" content="星语剧场 Starry Theater — 纯本地运行、自带 API 的沉浸式视觉小说框架" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <title>星语剧场</title>
  </head>
  <body>
    <div id="app" class="app">
      <div id="stage" class="stage">
        <div id="bg-layer" class="bg-layer is-empty"></div>
        <div id="bg-veil" class="bg-veil"></div>
        <canvas id="particle-canvas" class="particle-canvas"></canvas>
        <div id="sprite-layer" class="sprite-layer"></div>
        <div id="blush-layer" class="blush-layer"></div>
        <div id="vignette" class="vignette"></div>
      </div>

      <header class="hud">
        <button id="bond-badge" class="bond-badge" title="羁绊手账" aria-label="羁绊手账">
          <span class="bond-ring">
            <span class="bond-ring-heart">♥</span>
            <span id="bond-level" class="bond-ring-level">Lv.3</span>
          </span>
          <span class="bond-info">
            <span class="bond-line">
              <span id="bond-title" class="bond-title">羁绊·心动</span>
              <span id="bond-value" class="bond-value">480 / 600</span>
            </span>
            <span class="bond-track"><i id="bond-fill" style="width: 60%"></i></span>
          </span>
        </button>

        <nav class="hud-nav" aria-label="功能导航">
          <button class="nav-btn" data-panel="characters" type="button" title="角色工坊">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"
              />
            </svg>
            <span>角色工坊</span>
          </button>

          <button class="nav-btn" data-panel="memories" type="button" title="羁绊手账">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25"
              />
            </svg>
            <span>羁绊手账</span>
          </button>

          <button class="nav-btn" data-panel="api" type="button" title="API 设置">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z"
              />
            </svg>
            <span>API 设置</span>
          </button>

          <button class="nav-btn" data-panel="settings" type="button" title="设置">
            <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.325.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 0 1 1.37.49l1.296 2.247a1.125 1.125 0 0 1-.26 1.431l-1.003.827c-.293.241-.438.613-.43.992a7.723 7.723 0 0 1 0 .255c-.008.378.137.75.43.991l1.004.827c.424.35.534.955.26 1.43l-1.298 2.247a1.125 1.125 0 0 1-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.47 6.47 0 0 1-.22.128c-.331.183-.581.495-.644.869l-.213 1.281c-.09.543-.56.94-1.11.94h-2.594c-.55 0-1.019-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 0 1-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 0 1-1.369-.49l-1.297-2.247a1.125 1.125 0 0 1 .26-1.431l1.004-.827c.292-.24.437-.613.43-.991a6.932 6.932 0 0 1 0-.255c.007-.38-.138-.751-.43-.992l-1.004-.827a1.125 1.125 0 0 1-.26-1.43l1.297-2.247a1.125 1.125 0 0 1 1.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.086.22-.128.332-.183.582-.495.644-.869l.214-1.28Z"
              />
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
            </svg>
            <span>设置</span>
          </button>
        </nav>
      </header>

      <section id="dialogue" class="dialogue" aria-live="polite">
        <div class="nameplate">
          <span class="nameplate-star">✦</span>
          <span id="nameplate" class="nameplate-name">艾拉</span>
          <span id="char-title" class="nameplate-title">· 时空管家</span>
        </div>
        <span class="dialogue-spark" aria-hidden="true">✦</span>
        <p id="dialogue-text" class="dialogue-text"></p>
        <div class="dialogue-foot">
          <button id="continue-btn" class="continue-btn" type="button">
            继续 <span>»</span>
          </button>
        </div>
      </section>

      <div class="input-bar">
        <div class="input-shell">
          <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="m16.862 4.487 1.687-1.688a1.875 1.875 0 1 1 2.652 2.652L6.832 19.82a4.5 4.5 0 0 1-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 0 1 1.13-1.897L16.863 4.487Zm0 0L19.5 7.125"
            />
          </svg>
          <input
            id="chat-input"
            class="chat-input"
            type="text"
            autocomplete="off"
            placeholder="输入你的回应..."
            enterkeyhint="send"
          />
        </div>
        <button id="send-btn" class="send-btn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
            <path
              d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z"
            />
          </svg>
          <span>发送</span>
        </button>
      </div>

      <div id="modal-root" class="modal-root" hidden></div>
      <div id="toast-root" class="toast-root"></div>
      <div id="busy-hint" class="busy-hint" hidden>
        <span class="busy-star">✦</span>
        <span id="busy-text">星光正在汇聚…</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
